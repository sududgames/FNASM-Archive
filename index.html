<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNASM Arxive — Каталог APK</title>
<style>
  :root{
    --bg:#0b0e14; --card:#151b28; --line:#232c3d;
    --txt:#e8ecf4; --mut:#8b94a7; --acc:#4f8cff; --acc2:#37d0a2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh}

  header{background:linear-gradient(135deg,#10151f 0%,#141b2a 100%);
    border-bottom:1px solid var(--line);padding:22px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#7a5cff);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;
    box-shadow:0 0 24px rgba(79,140,255,.35)}
  h1{font-size:26px;letter-spacing:.5px}
  h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .tag{color:var(--mut);font-size:13px;margin-top:2px}

  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px auto;max-width:1100px;padding:0 20px}
  .search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px}
  .search input::placeholder{color:var(--mut)}
  .count{color:var(--mut);font-size:14px;margin-left:auto}

  .grid{max-width:1100px;margin:0 auto;padding:0 20px 60px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
    transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    display:flex;flex-direction:column;gap:12px}
  .card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 28px rgba(79,140,255,.15)}
  .app-ver{color:var(--acc);font-weight:600;font-size:18px;line-height:1.3}
  .desc{color:var(--mut);font-size:13.5px;line-height:1.5;flex:1}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg,var(--acc),#3b6fd4);color:#fff;text-decoration:none;
    font-weight:600;font-size:14.5px;padding:11px 16px;border-radius:11px;
    transition:filter .15s ease;text-align:center;border:none;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.15)}

  footer{border-top:1px solid var(--line);color:var(--mut);font-size:13px;
    text-align:center;padding:24px 20px}

  .empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0;font-size:16px;display:none}

  @media(max-width:640px){h1{font-size:22px}.count{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo">FA</div>
  <div>
    <h1 id="site-title">FNASM <span>Arxive</span></h1>
    <div class="tag" id="site-subtitle">Загрузка…</div>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b94a7" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
    </svg>
    <input id="q" type="text" placeholder="Поиск по описанию…">
  </div>
  <div class="count" id="count"></div>
</div>

<main class="grid" id="grid"></main>
<div class="empty" id="empty">Ничего не найдено. Попробуйте изменить запрос.</div>

<footer id="footer">Загрузка…</footer>

<script>
const grid   = document.getElementById('grid');
const q      = document.getElementById('q');
const count  = document.getElementById('count');
const empty  = document.getElementById('empty');

let APPS = [];
let LANG = 'ru';

const UI = {
  ru: {
    searchPh:     'Поиск по описанию…',
    appCount:     n => `Приложений: ${n}`,
    empty:        'Ничего не найдено. Попробуйте изменить запрос.',
    version:      v => `Версия ${v}`,
    download:     '⬇ Скачать APK',
    loadError:    'Не удалось загрузить каталог',
    titleSuffix:  '— Каталог APK'
  },
  en: {
    searchPh:     'Search by description…',
    appCount:     n => `Apps: ${n}`,
    empty:        'Nothing found. Try a different query.',
    version:      v => `Version ${v}`,
    download:     '⬇ Download APK',
    loadError:    'Failed to load catalog',
    titleSuffix:  '— APK Catalog'
  }
};

function detectLang(){
  const langs = navigator.languages || [navigator.language || 'ru'];
  for (const l of langs){
    if (l && l.toLowerCase().startsWith('ru')) return 'ru';
  }
  return 'en';
}

async function loadConfig(){
  LANG = detectLang();
  document.documentElement.lang = LANG;

  const t = UI[LANG];
  q.placeholder = t.searchPh;
  empty.textContent = t.empty;

  try{
    const res = await fetch('apk.' + LANG + '.json?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if(data.site){
      document.title = data.site.title + ' ' + t.titleSuffix;
      document.getElementById('site-title').innerHTML =
        data.site.title.replace(/(\S+)$/, '<span>$1</span>');
      document.getElementById('site-subtitle').textContent = data.site.subtitle || '';
      document.getElementById('footer').textContent = data.site.footer || '';
    }

    APPS = data.apps || [];
    render();
  }catch(e){
    console.error(e);
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#8b94a7;padding:60px 0;">' +
                     t.loadError + '<br><small>' + e.message + '</small></div>';
  }
}

function render(){
  const t = UI[LANG];
  const query = q.value.toLowerCase().trim();
  const list = APPS.filter(a =>
    (a.desc || '').toLowerCase().includes(query) ||
    (a.ver || '').toLowerCase().includes(query)
  );

  grid.innerHTML = '';
  count.textContent = t.appCount(list.length);
  empty.style.display = list.length ? 'none' : 'block';

  list.forEach(app => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="app-ver">${t.version(app.ver || '—')}</div>
      <div class="desc">${app.desc || ''}</div>
      <a class="btn" href="${app.file}" download>${t.download}</a>
    `;
    grid.appendChild(card);
  });
}

q.addEventListener('input', render);
loadConfig();
</script>
</body>
</html>
